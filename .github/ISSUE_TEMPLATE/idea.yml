name: اقتراح لتحسين التطبيق · Suggest an improvement
description: ما الذي سيجعل «منهاجنا» أوضح أو أنفع في عملك؟
labels: ['enhancement']
body:
  - type: markdown
    attributes:
      value: |
        **الاقتراح علني.** استعمل أمثلة مختلقة، دون بيانات تلاميذ حقيقيين أو معلومات شخصية أو صور أشخاص.

        يمكنك أيضاً مراسلتنا على [فيسبوك](https://www.facebook.com/djazairdev) أو [contact@djazair.dev](mailto:contact@djazair.dev). لمشكلة أمن أو خصوصية، [أبلغ بشكل خاص](https://github.com/djazairdev/minhajna/security/policy).

        **Suggestions are public.** Use invented examples, without real pupil data, personal details or photos of people. You can also use Facebook or email above. [Report security problems privately](https://github.com/djazairdev/minhajna/security/policy).
  - type: checkboxes
    id: privacy
    attributes:
      label: قبل النشر · Before posting
      options:
        - label: الأمثلة مختلقة، ولا أُرفق بيانات تلاميذ حقيقيين أو معلومات شخصية أو صور أشخاص. / Invented examples only; no real pupil data, personal details or photos of people.
          required: true
  - type: textarea
    id: problem
    attributes:
      label: ما الذي يصعّب عملك؟ · What gets in the way?
      description: ما الذي تريد إنجازه؟ لا تسمِّ أشخاصاً أو مؤسسات حقيقية.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: كيف تقترح تحسينه؟ · Your suggestion
      description: اختياري؛ يمكنك الاكتفاء بوصف المشكلة.
