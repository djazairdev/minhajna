# The build, the type checks, the linter and the tests
# (docs/contributing/workflow.md#pull-requests). The release workflow calls it
# before a release (release.yml).

name: Test

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions: {}

concurrency:
  # Called by the release workflow, github.workflow names the caller.
  group: test-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  test:
    name: Node.js 22
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    # The server's tests and its migrations check run against PostgreSQL,
    # the same image as the local demo (apps/server/compose.yaml), on this
    # runner only.
    services:
      postgres:
        image: postgres:18.6-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
        env:
          POSTGRES_USER: minhajna
          POSTGRES_DB: minhajna_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U minhajna -d minhajna_test"
          --health-interval 2s --health-timeout 2s --health-retries 30
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          # No dependency cache: the install is small, and a cache would be
          # one more service to call and to trust.
          package-manager-cache: false

      # .npmrc stops install scripts. --no-audit keeps npm from sending the
      # dependency tree to the registry: the dependency review checks
      # vulnerabilities instead.
      - name: Install the locked dependencies
        run: npm ci --no-audit

      # The linter checks the Android app with the app's own types, so the
      # app's locked dependencies are installed too. Its .npmrc stops install
      # scripts as well.
      - name: Install the app's locked dependencies
        working-directory: apps/android
        run: npm ci --no-audit

      # The PC web app has its own lockfile too (#250); the linter checks its
      # build scripts with esbuild's types. Its .npmrc stops install scripts.
      - name: Install the web app's locked dependencies
        working-directory: apps/web
        run: npm ci --no-audit

      # The server has its own lockfile too (#538), and Prisma's command line
      # its own in tools/prisma (#542), so it never installs with the server.
      # The linter checks the server with NestJS's types and its generated
      # Prisma client, which needs no download. Both .npmrc files stop
      # install scripts.
      - name: Install the server's locked dependencies
        working-directory: apps/server
        run: npm ci --no-audit && npm run tools && npm run generate

      # The build and the linter run once the project has those scripts.
      - name: Build
        run: npm run build --if-present

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint --if-present

      - name: Test
        run: npm test

      # The committed SQL migrations, applied to an empty database, must
      # give exactly the tables schema.prisma describes: prisma migrate diff
      # exits with 2 when they differ. It fetches Prisma's schema engine,
      # here in CI only; the server itself never runs it.
      - name: Check the server's migrations against its schema
        working-directory: apps/server
        env:
          DATABASE_URL: postgresql://minhajna@127.0.0.1:5432/minhajna_test
        run: |
          npm run build
          npm run migrate
          npm run diff -- --exit-code

      # The server's tests build it and start it on this machine only, and
      # use the runner's PostgreSQL.
      - name: Type check and test the server
        working-directory: apps/server
        env:
          TEST_DATABASE_URL: postgresql://minhajna@127.0.0.1:5432/minhajna_test
        run: npm run typecheck && npm test

      # The web app's tests build its bundle twice and check it.
      - name: Type check and test the web app
        working-directory: apps/web
        run: npm run typecheck && npm test

      # The demo scenarios (#629, answer 586) run against `npm run demo`, as
      # whoever shows the demo starts it, on a demo database of its own on the
      # runner's PostgreSQL, which --fresh empties first, as it empties no
      # other. The demo stops when the step ends.
      - name: Run the demo scenarios
        env:
          MINHAJNA_DEMO_DATABASE: postgresql://minhajna@127.0.0.1:5432/minhajna_demo
        run: |
          createdb -h 127.0.0.1 -U minhajna minhajna_demo
          npm run demo -- --fresh & demo=$!
          trap 'kill "$demo" 2>/dev/null || true' EXIT
          node tools/demo-scenario/run.js --wait 300

      # The ZIP a release attaches and the host serves (answer 528), kept to
      # compare with the release manager's: the same build packs to the same
      # bytes on any system.
      - name: Pack the web app for its host
        working-directory: apps/web
        run: npm run build && npm run zip

      - name: Keep the web app's ZIP for the comparison
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-zip
          path: apps/web/release/*.zip
          if-no-files-found: error
          retention-days: 7
