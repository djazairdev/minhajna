# The licences and known vulnerabilities of the dependencies a pull request
# adds or changes (docs/contributing/engineering.md#dependencies).

name: Dependency review

on:
  pull_request:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    name: Licences and vulnerabilities
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Review the changed dependencies
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          # Any known vulnerability fails, in development tools too.
          fail-on-severity: low
          fail-on-scopes: runtime, development, unknown
          # The allowed licences in engineering.md. Any other licence fails,
          # so that a maintainer decides, as engineering.md asks.
          allow-licenses: >-
            MIT, ISC, 0BSD, Zlib, BSD-2-Clause, BSD-3-Clause, Apache-2.0,
            MPL-2.0, LGPL-2.1-or-later, LGPL-3.0-or-later, GPL-3.0-or-later,
            AGPL-3.0-or-later, OFL-1.1, CC0-1.0, CC-BY-4.0, CC-BY-SA-4.0
          # Exceptions a maintainer accepted, each by name, with its reason.
          # None of them reaches the apps or installs with the server.
          # - argparse 2 is a port of Python's argparse, under the Python
          #   Software Foundation licence. Build tools load it through
          #   js-yaml.
          # - minimatch 10 matches file paths for ESLint. It is under the
          #   Blue Oak Model License 1.0.0, a permissive licence approved by
          #   the OSI.
          # - The server's build tool, Prisma's command line (#542, answer
          #   553), installed apart in apps/server/tools/prisma, brings four
          #   more that only its Studio and its own database tools load:
          #   elkjs (EPL-2.0) and @visx/vendor (declared as "MIT and ISC")
          #   lay out Studio's graphs, robust-predicates (Unlicense) is under
          #   them, and postgres (Unlicense) is the tool's own driver.
          allow-dependencies-licenses: >-
            pkg:npm/argparse, pkg:npm/minimatch, pkg:npm/elkjs,
            pkg:npm/@visx/vendor, pkg:npm/%40visx/vendor, pkg:npm/robust-predicates,
            pkg:npm/postgres
          # Advisories with no fixed version yet, in tools that run on the
          # developer's machine, on the project's own files, such as Metro and
          # Jest. Neither library reaches the apps. Remove each advisory once
          # its fix ships.
          # - GHSA-vfj7-8cjw-p6xm: braces, deeply nested patterns.
          # - GHSA-hp3w-g68c-fv3c: sprintf-js, an unbounded precision.
          allow-ghsas: GHSA-vfj7-8cjw-p6xm, GHSA-hp3w-g68c-fv3c
          # Scorecards would mean calls to a third-party service.
          show-openssf-scorecard: false
