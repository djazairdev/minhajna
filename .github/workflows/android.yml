# SPDX-License-Identifier: AGPL-3.0-or-later

# The Android app, built twice from clean checkouts at different paths. Each
# release APK (universal, 32-bit and 64-bit ARM) must be the same byte for byte
# in both copies, ask for no permission but the biometric prompt's, and hold no
# code that F-Droid's scanner knows as non-free (docs/checks/android-build.md).

name: Android

on:
  pull_request:
    paths:
      - apps/android/**
      - packages/core/**
      - data/**
      - LICENSES/AGPL-3.0-or-later.txt
      - tools/android/**
      - docs/design/system/tokens.json
      - .github/workflows/android.yml
  push:
    branches: [main]
    paths:
      - apps/android/**
      - packages/core/**
      - data/**
      - LICENSES/AGPL-3.0-or-later.txt
      - tools/android/**
      - docs/design/system/tokens.json
      - .github/workflows/android.yml

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

env:
  # The runner's SDK has the platform and the build tools. The NDK and CMake
  # are the versions React Native's template asks for.
  BUILD_TOOLS: '37.0.0'
  NDK: '27.1.12297006'
  CMAKE: '3.22.1'
  # Gradle's published checksum for the 9.4.1 wrapper. It changes with the
  # wrapper, in the same pull request.
  GRADLE_WRAPPER_SHA256: 55243ef57851f12b070ad14f7f5bb8302daceeebc5bce5ece5fa6edb23e1145c

jobs:
  build:
    name: Build (${{ matrix.copy }} copy)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
    strategy:
      matrix:
        # A path that leaks into the APK makes the two copies differ.
        include:
          - copy: first
            path: minhajna
          - copy: second
            path: another/copy/of/minhajna
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: ${{ matrix.path }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          # No dependency cache: a cache would be one more service to call
          # and to trust.
          package-manager-cache: false

      - name: Install the NDK and CMake
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            "ndk;$NDK" "cmake;$CMAKE" > /dev/null
          java -version

      - name: Check the Gradle wrapper
        working-directory: ${{ matrix.path }}/apps/android/android
        run: echo "$GRADLE_WRAPPER_SHA256  gradle/wrapper/gradle-wrapper.jar" | sha256sum --check --strict

      # .npmrc stops install scripts. --no-audit keeps npm from sending the
      # dependency tree to the registry.
      - name: Install the locked dependencies
        working-directory: ${{ matrix.path }}/apps/android
        run: npm ci --no-audit

      - name: Type check
        working-directory: ${{ matrix.path }}/apps/android
        run: npm run typecheck

      - name: Test
        working-directory: ${{ matrix.path }}/apps/android
        run: npm test

      - name: Build the release APKs
        working-directory: ${{ matrix.path }}/apps/android/android
        run: ./gradlew --no-daemon assembleRelease

      - name: Check every APK, its fonts and its notices
        working-directory: ${{ matrix.path }}
        run: node tools/android/release-apks.js verify apps/android/android/app/build/outputs/apk/release

      # Only biometrics (#210), foreground QR scanning (#222) and the
      # notifications set ahead with their restart (#234) are allowed. The
      # manifest removes the permission needed by ContextCompat's receiver
      # helper on Android 12 and earlier. R8 keeps that helper recognisable
      # and uninlined (app/proguard-rules.pro), so a new caller still fails.
      - name: Check that no APK asks for another permission or needs the removed receiver permission
        working-directory: ${{ matrix.path }}/apps/android/android
        run: |
          tools="$ANDROID_HOME/build-tools/$BUILD_TOOLS"
          for abi in universal armeabi-v7a arm64-v8a; do
            apk="app/build/outputs/apk/release/app-$abi-release-unsigned.apk"
            permissions=$("$tools/aapt2" dump permissions "$apk" |
              grep -v -e '^package:' -e "^uses-permission: name='android.permission.USE_BIOMETRIC'\$" -e "^uses-permission: name='android.permission.CAMERA'\$" \
                -e "^uses-permission: name='android.permission.POST_NOTIFICATIONS'\$" \
                -e "^uses-permission: name='android.permission.RECEIVE_BOOT_COMPLETED'\$" || true)
            if [[ -n "$permissions" ]]; then
              echo "::error title=Permissions::$abi asks for permissions (NETWORK.md): $permissions"
              exit 1
            fi
            dex="$RUNNER_TEMP/dex/$abi"
            mkdir -p "$dex"
            unzip -q -o "$apk" 'classes*.dex' -d "$dex"
            callers=$("$tools/dexdump" -d "$dex"/classes*.dex |
              awk -v self="'Landroidx/core/content/ContextCompat;'" '
                /Class descriptor/ { class = $4 }
                /Landroidx\/core\/content\/ContextCompat;\.registerReceiver/ && class != self { print class }
              ' | sort -u)
            if [[ -n "$callers" ]]; then
              echo "::error title=Receivers::$abi calls the receiver helper without its removed permission: $callers"
              exit 1
            fi
          done

      - name: Keep every APK for the comparison
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: apk-${{ matrix.copy }}
          path: |
            ${{ matrix.path }}/apps/android/android/app/build/outputs/apk/release/*.apk
            ${{ matrix.path }}/apps/android/android/app/build/outputs/apk/release/output-metadata.json
          if-no-files-found: error
          retention-days: 7

      # The longest GitHub keeps an artifact. A published preview keeps its own
      # copy of the mapping (docs/field-check/session-guide.md).
      - name: Keep the shrinker's mapping and configuration
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mapping-${{ matrix.copy }}
          path: ${{ matrix.path }}/apps/android/android/app/build/outputs/mapping/release/
          if-no-files-found: error
          retention-days: 90

  compare:
    name: Same APK twice
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out the comparison tool
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false

      - name: Download the two APKs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: apk-*
          path: apks

      - name: Compare them byte for byte
        run: node tools/android/release-apks.js compare apks/apk-first apks/apk-second

  scan:
    name: F-Droid scanner
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions: {}
    steps:
      - name: Download the first copy's APKs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: apk-first
          path: apk

      - name: Install F-Droid's tools
        env:
          FDROIDSERVER_VERSION: '2.4.5'
        run: |
          python3 -m venv "$RUNNER_TEMP/fdroid"
          "$RUNNER_TEMP/fdroid/bin/pip" install --quiet "fdroidserver==$FDROIDSERVER_VERSION"

      # --refresh fetches F-Droid's latest list of non-free libraries.
      - name: Scan each APK for non-free code
        run: |
          export PATH="$ANDROID_HOME/build-tools/$BUILD_TOOLS:$PATH"
          for abi in universal armeabi-v7a arm64-v8a; do
            "$RUNNER_TEMP/fdroid/bin/fdroid" scanner --refresh --exit-code --verbose \
              "apk/app-$abi-release-unsigned.apk"
          done
