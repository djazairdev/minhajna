<!doctype html>
<html lang="ar">
<head>
<meta charset="utf-8">
<title>Minhajna</title>
<link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@700&amp;family=Noto+Naskh+Arabic:wght@400&amp;display=swap" rel="stylesheet">
<style>
  html, body { margin:0; height:100%; }
  body { background:var(--paper); color:var(--ink); overflow:hidden; }
  .cover { position:relative; height:288px; overflow:hidden; }
  .art { position:absolute; top:0; left:480px; width:480px; height:288px; overflow:hidden; }
  .art svg { display:block; width:480px; height:288px; }
  .board { fill:var(--board); }
  .subject { fill:var(--ar); }
  .ledge { fill:var(--hi); }
  .chalk { fill:var(--chalk); }
  .blk { rx:var(--radius-button); }
  .strip { rx:var(--radius-tag); }
  .words { position:absolute; left:24px; bottom:24px; max-width:440px; direction:rtl; }
  .name { margin:0; font:700 104px/1.3 "Aref Ruqaa", serif; color:var(--ink); }
  .tag { margin:8px 0 0; font:400 14px/20px "Noto Naskh Arabic", serif; color:var(--ink2); }
</style>
<link rel="stylesheet" href="../../tokens.css">
<link rel="stylesheet" href="../bundle.css">
</head>
<body>
<div class="cover">
<div class="art" aria-hidden="true">
<svg viewBox="0 0 480 288" width="480" height="288">
<!--
  blocks      board 296×240 bled off the top (the blackboard, the identity) · ar 152×176 bled off the right (the subject colour) · hi 296×12 under the board (its chalk ledge) — about 35% of 960×288
  arrangement one tall slab with a satellite and a ledge; bottoms on one line, space-24 above the edge, space-16 gutters
  pattern     one oversized glyph from the display face: the chalk «م» of the logo, clipped by the board, because the brand is a teacher's hand on the blackboard
  scales      gutters space-16, bottom margin space-24, block corners radius-button, ledge radius-tag
-->
<defs><clipPath id="slab"><rect x="32" y="-16" width="296" height="240" rx="14"/></clipPath></defs>
<rect class="board blk" x="32" y="-16" width="296" height="240" rx="14"/>
<g clip-path="url(#slab)">
  <path class="chalk" transform="translate(-60 -40)" d="M317.6 112.5C342.5 112.5 358.1 128.1 356.3 150.2C354.4 170.4 337 183.3 314 185.2C284.5 187 253.2 199 229.3 210C212.8 217.4 205.4 226.6 204.5 243.1C203.6 298.3 200.8 349.8 195.3 394.9C194.4 400.4 187.9 400.4 187 394.9C174.1 344.3 157.6 292.8 156.6 235.8C155.7 193.4 172.3 167.7 205.4 160.3C240.4 153 266.1 136.4 285.4 121.7C294.6 115.2 305.7 112.5 317.6 112.5Z"/>
</g>
<rect class="ledge strip" x="32" y="232" width="296" height="12" rx="6"/>
<rect class="subject blk" x="344" y="68" width="152" height="176" rx="14"/>
</svg>
</div>
<div class="words">
<h1 class="name">منهاجنا</h1>
<p class="tag">من المخطط السنوي إلى درس اليوم</p>
</div>
</div>
</body>
</html>
