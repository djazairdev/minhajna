version = 1

# Documents and content are CC BY-SA 4.0; code is AGPL-3.0-or-later (PRD §1.3).
[[annotations]]
path = ["*.md", "data/**", "docs/**", "packages/*/README.md", "apps/android/fonts/README.md", "infra/weblate/README.md", "apps/android/android/app/src/main/assets/licenses/data.txt", "changelog.d/*.md"]
SPDX-FileCopyrightText = "2026 The Minhajna contributors"
SPDX-License-Identifier = "CC-BY-SA-4.0"

# Code files that cannot hold a comment.
[[annotations]]
path = ["package.json", "package-lock.json", "tsconfig.base.json", "packages/*/package.json", "packages/*/tsconfig.json", "packages/*/tsconfig.*.json", "packages/*/test/tsconfig.json", "packages/*/scripts/tsconfig.json", "packages/*/test/portable/tsconfig.json", "packages/core/test/sha256-vectors.json", "packages/web-storage-check/public/manifest.webmanifest"]
SPDX-FileCopyrightText = "2026 The Minhajna contributors"
SPDX-License-Identifier = "AGPL-3.0-or-later"

# The Android app's files that cannot hold a comment.
[[annotations]]
path = ["apps/android/package.json", "apps/android/package-lock.json", "apps/android/app.json", "apps/android/src/text/*.json", "apps/android/src/settings/text/*.json", "infra/weblate/project.json", "infra/weblate/component.json", "infra/weblate/namespaces.json"]
SPDX-FileCopyrightText = "2026 The Minhajna contributors"
SPDX-License-Identifier = "AGPL-3.0-or-later"

# TypeScript settings based on React Native's app template.
[[annotations]]
path = "apps/android/tsconfig.json"
SPDX-FileCopyrightText = ["Meta Platforms, Inc. and affiliates", "2026 The Minhajna contributors"]
SPDX-License-Identifier = "MIT"

# Gradle's wrapper, as Gradle generates it.
[[annotations]]
path = ["apps/android/android/gradle/wrapper/gradle-wrapper.jar", "apps/android/android/gradle/wrapper/gradle-wrapper.properties"]
SPDX-FileCopyrightText = "2015 the original author or authors"
SPDX-License-Identifier = "Apache-2.0"

# Unmodified fonts from their upstream releases; only filenames change for
# Android resources. Copyright and licence notices are also inside the APK.
[[annotations]]
path = "apps/android/android/app/src/main/res/font/aref_ruqaa_bold.ttf"
SPDX-FileCopyrightText = "2015-2022 The Aref Ruqaa Project Authors (https://github.com/aliftype/aref-ruqaa), with Reserved Font Name EURM10."
SPDX-License-Identifier = "OFL-1.1"

[[annotations]]
path = "apps/android/android/app/src/main/res/font/noto_naskh_arabic_*.ttf"
SPDX-FileCopyrightText = "2022 The Noto Project Authors (https://github.com/notofonts/arabic)"
SPDX-License-Identifier = "OFL-1.1"

[[annotations]]
