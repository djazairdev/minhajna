version = 1

# Documents and content are CC BY-SA 4.0; code is AGPL-3.0-or-later (PRD §1.3).
[[annotations]]
path = ["*.md", "data/**", "docs/**", "packages/*/README.md"]
SPDX-FileCopyrightText = "2026 The Minhajna contributors"
SPDX-License-Identifier = "CC-BY-SA-4.0"

# Code files that cannot hold a comment.
[[annotations]]
path = ["package.json", "package-lock.json", "tsconfig.base.json", "packages/*/package.json", "packages/*/tsconfig.json", "packages/*/test/tsconfig.json"]
SPDX-FileCopyrightText = "2026 The Minhajna contributors"
SPDX-License-Identifier = "AGPL-3.0-or-later"

# The Android app's files that cannot hold a comment.
[[annotations]]
path = ["apps/android/package.json", "apps/android/package-lock.json", "apps/android/app.json", "apps/android/src/text/*.json"]
SPDX-FileCopyrightText = "2026 The Minhajna contributors"
SPDX-License-Identifier = "AGPL-3.0-or-later"

# TypeScript settings based on React Native's app template.
[[annotations]]
path = "apps/android/tsconfig.json"
SPDX-FileCopyrightText = ["Meta Platforms, Inc. and affiliates", "2026 The Minhajna contributors"]
SPDX-License-Identifier = "MIT"

# Gradle's wrapper, as Gradle generates it.
[[annotations]]
path = ["apps/android/android/gradle/wrapper/gradle-wrapper.jar", "apps/android/android/gradle/wrapper/gradle-wrapper.properties"]
SPDX-FileCopyrightText = "2015 the original author or authors"
SPDX-License-Identifier = "Apache-2.0"
