buildscript {
    ext {
        buildToolsVersion = "37.0.0"
        // Android 8, which reaches about 97.9% of Algerian Android traffic (PRD §6.8).
        minSdkVersion = 26
        compileSdkVersion = 37
        targetSdkVersion = 36
        ndkVersion = "27.1.12297006"
        kotlinVersion = "2.2.0"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
    }
}

apply plugin: "com.facebook.react.rootproject"

// No proprietary library, not even through another dependency: anyone, F-Droid
// included, must be able to build the app from source, and no SDK may send
// data (engineering.md, PRD §1.3). Resolving one stops the build.
def proprietaryGroups = [
    "com.google.android.gms",           // Google Play services
    "com.google.firebase",
    "com.google.android.play",          // Play Core: updates, reviews, delivery
    "com.google.android.datatransport", // Firebase's transport
    "com.google.android.ads",
    "com.google.android.ump",           // Google's consent SDK
    "com.google.mlkit",
    "com.android.billingclient",
    "com.android.installreferrer",
    "com.crashlytics.sdk.android",
    "io.fabric.sdk.android",
    "com.facebook.android",             // Facebook's SDKs, not React Native
    "com.huawei.hms",
    "com.amazon.device",
]

allprojects {
    // Screens builds its own native library, so the app's CMake flags do not
    // reach it. Apply the same path/compiler protections as app/build.gradle.
    if (name == "react-native-screens") {
        plugins.withId("com.android.library") {
            android.defaultConfig.externalNativeBuild.cmake {
                def compileFlags = []
                [
                    (rootProject.projectDir.parentFile): "/app",
                    (gradle.gradleUserHomeDir): "/gradle",
                    (android.sdkDirectory): "/sdk",
                ].each { dir, replacement ->
                    def paths = [dir.absolutePath, dir.canonicalPath]
                    paths += paths.findAll { it.startsWith("/private/") }*.substring("/private".length())
                    paths.unique().findAll { !(it =~ /\s/) }.each {
                        compileFlags << "-ffile-prefix-map=${it}=${replacement}"
                    }
                }
                cFlags(*compileFlags)
                cppFlags(*compileFlags)
                def linkFlags = ["-Wl,--build-id=none"]
                def script = rootProject.file("app/no-comment.ld").absolutePath.replace("\\", "/")
                if (!(script =~ /\s/)) {
                    linkFlags << "-Wl,-T,${script}"
                }
                arguments "-DCMAKE_SHARED_LINKER_FLAGS=${linkFlags.join(" ")}"
            }
        }
    }

    configurations.configureEach {
        resolutionStrategy.eachDependency { details ->
            def group = details.requested.group
            if (proprietaryGroups.any { group == it || group.startsWith("${it}.") }) {
                throw new GradleException(
                    "${details.requested} is a proprietary library, which the app may not use " +
                    "(docs/contributing/engineering.md#pupil-data-and-privacy).")
            }
        }
    }
}
